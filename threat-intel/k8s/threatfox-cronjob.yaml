# Reconciled 2026-11-10 against the live urlhaus-threat-intel CronJob:
# same image, node pinning (k3s-node-2), script volume layout, and Secret
# (abuse-ch-key / AUTH_KEY). Differences on purpose: runs at :40 (URLhaus is
# :00, Feodo :20) so the three feeds never hit abuse.ch at the same moment,
# and backoffLimit 1 so a failure retries once instead of hammering the API.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: threatfox-threat-intel
  namespace: threat-intel
spec:
  # Hourly, same cadence assumed for urlhaus-threat-intel (see APPLY.md
  # "Chosen schedule / lookback pairing") — --lookback-hours 2 below pairs
  # with this schedule the same way it does for fetch-urlhaus.py.
  schedule: "40 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          nodeSelector:
            kubernetes.io/hostname: k3s-node-2
          containers:
            - name: fetch-threatfox
              image: python:3-alpine
              command: ["python3", "/scripts/fetch-threatfox.py", "--lookback-hours", "2"]
              env:
                - name: THREATFOX_AUTH_KEY
                  valueFrom:
                    secretKeyRef:
                      # abuse.ch Auth-Keys are account-wide, so ThreatFox reuses the
                      # same Secret URLhaus uses (abuse-ch-key, field AUTH_KEY).
                      name: abuse-ch-key
                      key: AUTH_KEY
              volumeMounts:
                - name: script-volume
                  mountPath: /scripts
          volumes:
            - name: script-volume
              configMap:
                name: threatfox-script
                defaultMode: 493
